<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Three.js scene</title>
<style>html, body { margin: 0; background: #0b0c10; overflow: hidden; } canvas { display: block; }</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
<script type="module">
  // Standard Three.js boilerplate: setAnimationLoop + THREE.Clock. No renderer-specific code
  // except the declared duration and size.
  import * as THREE from 'three';
  window.__render = { duration: 5, width: 1280, height: 720 };

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#0b0c10');
  scene.fog = new THREE.Fog('#0b0c10', 8, 22);
  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);

  const knot = new THREE.Mesh(
    new THREE.TorusKnotGeometry(1.6, 0.48, 256, 48),
    new THREE.MeshStandardMaterial({ color: '#ff7a59', metalness: 0.35, roughness: 0.25 }),
  );
  scene.add(knot);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 96), new THREE.MeshStandardMaterial({ color: '#16181f', roughness: 0.9 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -2.6;
  scene.add(floor);
  const rings = new THREE.Group();
  for (let i = 0; i < 24; i++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), new THREE.MeshBasicMaterial({ color: i % 2 ? '#6bcbff' : '#ffd93d' }));
    const a = (i / 24) * Math.PI * 2;
    m.position.set(Math.cos(a) * 3.6, Math.sin(a * 3) * 0.4, Math.sin(a) * 3.6);
    rings.add(m);
  }
  scene.add(rings);
  scene.add(new THREE.HemisphereLight('#bcd3ff', '#20140f', 0.9));
  const key = new THREE.DirectionalLight('#ffffff', 2.4);
  key.position.set(4, 6, 5);
  scene.add(key);
  const rim = new THREE.PointLight('#6bcbff', 30, 20);
  rim.position.set(-4, 1, -3);
  scene.add(rim);

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const t = clock.getElapsedTime();
    knot.rotation.x = t * 0.6;
    knot.rotation.y = t * 0.9;
    knot.scale.setScalar(0.6 + 0.4 * Math.min(1, t / 1.2) ** 0.5);
    rings.rotation.y = -t * 0.5;
    const ca = 0.6 + t * 0.25;
    camera.position.set(Math.sin(ca) * 9, 2.2 + Math.sin(t * 0.8) * 0.4, Math.cos(ca) * 9);
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
